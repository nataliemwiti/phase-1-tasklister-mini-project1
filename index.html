<!DOCTYPE HTML>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <title>Flatiron Task Lister</title>
  <link href="./style.css" rel="stylesheet" />
</head>

<body>
  
<div id="main-content">
  <h1>Task Lister Lite™️</h1>

  <form id="create-task-form" action="#" method="POST">
    <label for="new-task-description">Task description:</label>
    <input 
      type="text" 
      id="new-task-description" 
      name="new-task-description" 
      placeholder="description"
    />

    <label for="priority">Priority:</label>
    <select id="priority" name="priority">
      <option value="low">Low</option>
      <option value="medium">Medium</option>
      <option value="high">High</option>
    </select>

    <button id="sort-tasks" type="button">Sort by Priority</button>

    <button id="toggle-completed" type="button">Hide Completed</button>
    
    <label for="due-date">Due Date:</label>
    <input type="date" id="due-date" name="due-date" />

    <label for="assigned-user">Assigned To:</label>
    <input type="text" id="assigned-user" name="assigned-user" placeholder="e.g. Natalie" />


    <input type="submit" value="Create New Task" />
  </form>


  <div id="list">
    <h2>My Todos:</h2>
    <div id="tasks"></div>
  </div>
</div>

<script src="./src/index.js"></script>
</body>
</html>
